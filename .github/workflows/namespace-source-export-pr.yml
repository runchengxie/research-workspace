name: namespace source export pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'artifact/namespace-integration-export'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          submodules: false
      - run: tar --exclude=.git --exclude=.venv --exclude=artifacts --exclude=alpha-research --exclude=portfolio-backtester --exclude=strategy-pipeline --exclude=market-data-platform --exclude=quant-execution-engine -czf /tmp/research-workspace-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: research-workspace-source
          path: /tmp/research-workspace-source.tar.gz
          if-no-files-found: error
