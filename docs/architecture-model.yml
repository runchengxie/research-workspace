    runtime_cycle_check: true
  - id: deep-learning-tick-data-prediction
    repo_path: deep-learning-tick-data-prediction
    plane: research
    role: specialized-model-producer
    package_roots:
      - ticknet
    source_roots:
      - src/ticknet
    runtime_cycle_check: true
  - id: alpha-research
    repo_path: alpha-research
    plane: research
    role: alpha-owner
    package_roots:
      - alpha_research
    source_roots:
      - src/alpha_research
    runtime_cycle_check: true
  - id: portfolio-backtester
    repo_path: portfolio-backtester
    plane: research
    role: portfolio-and-backtest-owner
    package_roots:
      - portfolio_backtester
