{
  "schema_version": "framework_integration_ledger.v1",
  "decision": "docs/adr/0001-framework-integration-boundaries.md",
  "policy": {
    "native_default_until_parity": true,
    "optional_framework_dependencies": ["qlib", "vnpy"],
    "planned_optional_framework_dependencies": ["backtrader"],
    "forbidden_contract_types": ["qlib.*", "vnpy.*", "QuantConnect.*", "backtrader.*"],
    "submodule_pin_after_downstream_merge": true
  },
  "workstreams": [
    {
      "id": "artifact-envelope-v2",
      "owner": "research-workspace",
      "status": "in_progress",
      "implementation_prs": [
        "https://github.com/runchengxie/research-workspace/pull/19"
      ],
      "entry_criteria": [
        "v1 artifacts and readers have committed fixtures",
        "field ownership is agreed by producer and consumer repositories"
      ],
      "exit_criteria": [
        "v1 fixtures remain readable",
        "v2 provenance timestamps are timezone-aware",
        "lineage and configuration hashes are validated",
        "targets carry validity, scope, policy and idempotency metadata"
      ],
      "rollback": "disable v2 writers and continue reading and writing the pinned v1 contracts"
    },
    {
      "id": "qlib-data-adapter",
      "owner": "market-data-platform",
      "status": "in_progress",
      "current_state": "implemented_conditional",
      "current_evidence": [
        "market-data-platform/src/market_data_platform/integrations/qlib.py",
        "market-data-platform/tests/test_published_assets.py"
      ],
      "remaining_gap": "the standard dev profile does not install pyqlib, so the real-runtime test can skip",
      "implementation_prs": [
        "https://github.com/runchengxie/market-data-platform/pull/7"
      ],
      "entry_criteria": [
        "published asset manifest has a stable read-only owner API",
        "synthetic PIT universe and calendar fixtures exist"
      ],
      "exit_criteria": [
        "Qlib is an optional extra",
        "native publication imports no Qlib module",
        "native and adapter frames match on deterministic fixtures"
      ],
      "rollback": "remove or disable the adapter extra; published assets and current pointers remain unchanged"
    },
    {
      "id": "qlib-research-backend",
      "owner": "alpha-research",
      "status": "planned",
      "current_state": "port_only",
      "current_evidence": [
        "alpha-research/src/alpha_research/backends/base.py",
        "alpha-research/src/alpha_research/backends/native.py",
        "alpha-research/tests/test_research_backends.py"
      ],
      "historical_note": "the old cstree Qlib candidate did not enter the current owner-native main branch",
      "implementation_prs": [
        "https://github.com/runchengxie/alpha-research/pull/3",
        "https://github.com/runchengxie/alpha-research/pull/4",
        "https://github.com/runchengxie/alpha-research/pull/5"
      ],
      "entry_criteria": [
        "framework-neutral dataset and trainer ports wrap the native implementation",
        "signal artifact remains the public result"
      ],
      "exit_criteria": [
        "raw, infer and learn semantics have deterministic parity evidence",
        "PIT and leakage checks run before both backends",
        "promotion can be reproduced without a live Qlib runtime"
      ],
      "rollback": "select the native backend and keep Qlib-produced artifacts readable through canonical schemas"
    },
    {
      "id": "backtest-differential",
      "owner": "portfolio-backtester",
      "status": "planned",
      "current_state": "native_only",
      "current_evidence": [
        "portfolio-backtester/src/portfolio_backtester/backends/base.py",
        "portfolio-backtester/src/portfolio_backtester/backends/native.py",
        "portfolio-backtester/tests/fixtures/backends/liquid_long_only.expected.json"
      ],
      "historical_note": "the old cstree Qlib and LEAN candidates did not enter the current owner-native main branch",
      "implementation_prs": [
        "https://github.com/runchengxie/portfolio-backtester/pull/5",
        "https://github.com/runchengxie/portfolio-backtester/pull/6",
        "https://github.com/runchengxie/portfolio-backtester/pull/7"
      ],
      "entry_criteria": [
        "native replay is exposed behind a framework-neutral backend",
        "Top-K construction is represented by composable policies"
      ],
      "exit_criteria": [
        "date, position, turnover, cost and PnL differences are classified",
        "A-share rule differences are protected by native golden tests",
        "LEAN scenarios use only framework-neutral files"
      ],
      "rollback": "disable comparison backends and retain native A-share replay as canonical"
    },
    {
      "id": "strategy-pipeline-thinning",
      "owner": "strategy-pipeline",
      "status": "in_progress",
      "current_state": "owner_ports_and_standalone_research_apps",
      "implementation_prs": [
        "https://github.com/runchengxie/strategy-pipeline/pull/17",
        "https://github.com/runchengxie/strategy-pipeline/pull/19",
        "https://github.com/runchengxie/strategy-pipeline/pull/18"
      ],
      "entry_criteria": [
        "data, alpha, portfolio and execution-boundary owner ports exist",
        "current CLI behavior is covered by fixtures"
      ],
      "exit_criteria": [
        "pipeline contains no model fitting, PIT joins, portfolio algorithms or broker logic",
        "compatibility facades name an owner API and removal release",
        "target export is pure and deterministic"
      ],
      "rollback": "route owner ports to native compatibility adapters for the documented support window"
    },
    {
      "id": "vnpy-execution-transport",
      "owner": "quant-execution-engine",
      "status": "planned",
      "current_state": "generic_broker_boundary_only",
      "current_evidence": [
        "quant-execution-engine/src/quant_execution_engine/broker/base.py",
        "quant-execution-engine/src/quant_execution_engine/domain.py",
        "quant-execution-engine/tests/unit/test_typed_execution_domain.py"
      ],
      "historical_note": "the historical vn.py transport stack did not enter the current main branch",
      "implementation_prs": [
        "https://github.com/runchengxie/quant-execution-engine/pull/5",
        "https://github.com/runchengxie/quant-execution-engine/pull/6",
        "https://github.com/runchengxie/quant-execution-engine/pull/7",
        "https://github.com/runchengxie/quant-execution-engine/pull/8",
        "https://github.com/runchengxie/quant-execution-engine/pull/9"
      ],
      "entry_criteria": [
        "typed order intent and event contracts exist",
        "durable journal and idempotency are independent of transports",
        "a common transport conformance suite covers paper execution"
      ],
      "exit_criteria": [
        "vn.py is an optional extra",
        "shadow mode cannot send live orders",
        "duplicate and out-of-order callbacks are harmless",
        "restart and reconciliation evidence is deterministic"
      ],
      "rollback": "disable the vn.py transport and replay qexec journal through the native paper transport"
    },
    {
      "id": "backtrader-backtest-evaluation",
      "owner": "portfolio-backtester",
      "status": "planned",
      "current_state": "evaluation_only",
      "implementation_prs": [],
      "entry_criteria": [
        "a concrete backtest use case is not covered by native replay or Qlib differential testing",
        "the adapter can stay behind the existing framework-neutral backend interface"
      ],
      "exit_criteria": [
        "Backtrader is an optional dependency",
        "framework objects do not cross public result or artifact boundaries",
        "deterministic fixtures classify position, turnover, cost and PnL differences"
      ],
      "rollback": "remove the optional adapter and keep the native backend as canonical"
    }
  ]
}
