{
  "schema_version": "artifact_contracts.v1",
  "policy": {
    "purpose": "Machine-readable cross-module artifact contracts for the research workspace.",
    "shared_package_target": "research-contracts",
    "shared_package_status": "planned",
    "owner_rule": "The owning module defines the canonical runtime implementation until a formal shared package exists.",
    "workspace_rule": "The workspace may validate manifest and file handoff contracts, but must not import submodule runtime internals."
  },
  "artifact_envelope": {
    "schema_version": "research.artifact-envelope.v2",
    "container_key": "artifact_envelope",
    "write_mode": "opt_in",
    "legacy_readers_required": true,
    "required_fields": [
      "schema_version",
      "artifact_id",
      "artifact_type",
      "run_id",
      "created_at",
      "producer",
      "configuration_sha256",
      "content_sha256",
      "lineage"
    ],
    "producer_fields": [
      "repository",
      "version",
      "commit",
      "backend"
    ],
    "target_handoff_fields": [
      "valid_from",
      "expires_at",
      "portfolio_scope",
      "account_scope",
      "policy_reference",
      "idempotency_scope"
    ]
  },
  "artifacts": [
    {
      "artifact": "signals.parquet",
      "contract": "cstree.signals",
      "schema_version": 1,
      "owner": "alpha-research",
      "producer": "alpha-research",
      "external_producers": [
        "market-intel/hot-sector-screener"
      ],
      "consumers": [
        "portfolio-backtester",
        "strategy-pipeline"
      ],
      "canonical_files": [
        "signals.parquet"
      ],
      "entrypoints": [
        {
          "repo": "alpha-research",
          "module": "alpha_research.signal_artifact",
          "path": "src/alpha_research/signal_artifact.py",
          "role": "canonical_implementation"
        },
        {
          "repo": "strategy-pipeline",
          "module": "strategy_pipeline.contracts.signals",
          "path": "src/strategy_pipeline/contracts/signals.py",
          "role": "compatibility_contract"
        }
      ],
      "required_fields": [
        "signal_date",
        "symbol",
        "raw_pred",
        "signal_eval",
        "signal_backtest",
        "signal_direction",
        "rank",
        "model_version",
        "feature_set_id",
        "eligible_for_backtest",
        "eligible_for_live"
      ],
      "optional_fields": [
        "daily_confirm_score",
        "trend_score",
        "volume_score",
        "risk_score",
        "ret_5d",
        "ret_10d",
        "close_to_20d_high",
        "amount_ratio_20d",
        "confidence_score",
        "confidence_label"
      ],
      "notes": "Alpha owns canonical research signal generation and validation; market-intel/hot-sector-screener may produce external cstree.signals-compatible daily candidate signals with optional explanation columns. strategy-pipeline keeps only compatibility/orchestration-facing helpers until this moves into a shared package."
    },
    {
      "artifact": "signals.meta.json",
      "contract": "cstree.signals metadata",
      "schema_version": 1,
      "owner": "alpha-research",
      "producer": "alpha-research",
      "external_producers": [
        "market-intel/hot-sector-screener"
      ],
      "consumers": [
        "portfolio-backtester",
        "strategy-pipeline"
      ],
      "canonical_files": [
        "signals.meta.json"
      ],
      "entrypoints": [
        {
          "repo": "alpha-research",
          "module": "alpha_research.signal_artifact",
          "path": "src/alpha_research/signal_artifact.py",
          "role": "canonical_implementation"
        }
      ],
      "required_fields": [
        "contract",
        "schema_version",
        "file",
        "metadata_file",
        "rows",
        "required_columns"
      ],
      "notes": "Metadata travels with signals.parquet and records the schema and row-level summary needed by downstream audit. market-intel/hot-sector-screener emits compatible metadata for external daily candidate signals."
    },
    {
      "artifact": "positions_by_rebalance.csv",
      "contract": "cstree.positions_by_rebalance",
      "schema_version": 1,
      "owner": "portfolio-backtester",
      "producer": "portfolio-backtester",
      "consumers": [
        "strategy-pipeline"
      ],
      "canonical_files": [
        "positions_by_rebalance.csv"
      ],
      "entrypoints": [
        {
          "repo": "portfolio-backtester",
          "module": "portfolio_backtester.contracts",
          "path": "src/portfolio_backtester/contracts.py",
          "role": "canonical_implementation"
        }
      ],
      "required_fields": [
        "rebalance_date",
        "symbol",
        "weight"
      ],
      "common_fields": [
        "entry_date",
        "side",
        "signal",
        "rank"
      ],
      "notes": "Portfolio-backtester owns portfolio construction output; strategy-pipeline consumes saved positions for export-targets handoff."
    },
    {
      "artifact": "targets.json",
      "contract": "quant-execution-engine.targets/v2",
      "schema_version": 2,
      "owner": "quant-execution-engine",
      "producer": "strategy-pipeline",
      "consumers": [
        "quant-execution-engine"
      ],
      "canonical_files": [
        "targets.json",
        "targets.json.lineage.json"
      ],
      "entrypoints": [
        {
          "repo": "strategy-pipeline",
          "module": "cstree.liveops.export_targets",
          "path": "src/strategy_pipeline/liveops/export_targets.py",
          "role": "producer"
        },
        {
          "repo": "quant-execution-engine",
          "module": "quant_execution_engine.targets",
          "path": "src/quant_execution_engine/targets.py",
          "role": "canonical_parser"
        }
      ],
      "required_fields": [
        "targets",
        "symbol",
        "market",
        "target_weight",
        "target_quantity"
      ],
      "notes": "Research may export target holdings, but broker connection, dry-run planning, paper/live gates, and order audit stay inside quant-execution-engine."
    },
    {
      "artifact": "watchlist_20.csv",
      "contract": "daily_watch20.selection.v1",
      "schema_version": 1,
      "owner": "strategy-pipeline",
      "producer": "strategy-pipeline",
      "consumers": [
        "market-intel"
      ],
      "canonical_files": [
        "watchlist_20.csv",
        "watchlist_20.json"
      ],
      "entrypoints": [
        {
          "repo": "strategy-pipeline",
          "module": "cstree.daily_watch20_publish",
          "path": "src/strategy_pipeline/daily_watch20_publish.py",
          "role": "canonical_producer"
        }
      ],
      "required_fields": [
        "signal_date",
        "source_date",
        "symbol",
        "name",
        "sleeve",
        "rank",
        "tracking_weight",
        "xgb_score",
        "xgb_percentile",
        "guard_score",
        "final_score",
        "industry",
        "theme",
        "model_version",
        "feature_set_id",
        "data_as_of"
      ],
      "notes": "Internal-only SH/SZ research handoff with four pure-ML A names and sixteen guarded B names. Sleeve, score, rank, and tracking-weight fields are audit data and must not appear in the client renderer, which presents one unordered 20-name watchlist. Same-day minute inputs mean complete post-close partitions, not a realtime feed. This artifact is not an execution target."
    },
    {
      "artifact": "selection_receipt.json",
      "contract": "daily_watch20.selection.v1 receipt",
      "schema_version": 1,
      "owner": "strategy-pipeline",
      "producer": "strategy-pipeline",
      "consumers": [
        "market-intel"
      ],
      "canonical_files": [
        "selection_receipt.json"
      ],
      "entrypoints": [
        {
          "repo": "strategy-pipeline",
          "module": "cstree.daily_watch20_publish",
          "path": "src/strategy_pipeline/daily_watch20_publish.py",
          "role": "canonical_producer"
        }
      ],
      "required_fields": [
        "schema_version",
        "status",
        "quality_status",
        "generated_at",
        "market_scope",
        "source_date",
        "signal_date",
        "model_version",
        "feature_set_id",
        "eligible_for_live",
        "counts",
        "tracking_weight_sum",
        "minute_features",
        "label_policy",
        "model_lifecycle",
        "model_feature_policy",
        "news_heat",
        "training",
        "construction",
        "inputs",
        "artifacts"
      ],
      "notes": "Fail-closed lineage and quality evidence required before market-intel may render or deliver watchlist_20.csv. eligible_for_live remains false in the MVP."
    }
  ]
}
