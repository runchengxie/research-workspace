[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-platform-local-prototype"
version = "0.0.0"
description = "Local-only quant-platform migration prototype"
requires-python = ">=3.12"
dependencies = ["numpy>=2.5.2", "pandas>=2.0"]

[project.scripts]
portfolio-style-factor = "portfolio_backtester.style_factor_cli:main"

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.8"]

[tool.setuptools]
package-dir = {"" = "packages/portfolio-backtester/src"}

[tool.setuptools.packages.find]
where = ["packages/portfolio-backtester/src"]
include = ["portfolio_backtester", "portfolio_backtester.*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RET", "SIM", "RUF", "C90"]

[tool.ruff.lint.isort]
known-first-party = ["portfolio_backtester"]
