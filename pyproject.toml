[project]
name = "research-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.23",
  "pandas>=2.2",
  "pyarrow>=14",
  "pyyaml>=6.0",
  "tabulate>=0.9",
]

[dependency-groups]
dev = [
  "pip-audit>=2.7",
  "pytest>=9.0.3",
  "pytest-cov>=5",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/research_contracts/**/*.py", "scripts/**/*.py", "tests/**/*.py"]
extend-exclude = [
  ".git",
  ".pytest_cache",
  ".venv",
  "alpha-research",
  "strategy-pipeline",
  "market-data-platform",
  "portfolio-backtester",
  "quant-execution-engine",
  "strategy-app",
  "demo",
  "strategy-research",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901"]

[tool.ruff.lint.mccabe]
# 圈复杂度超过该值的函数视为错误，推动拆分过复杂的函数
max-complexity = 10

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true

[tool.ty.src]
include = [
  "scripts/dead_code_advisory.py",
  "scripts/framework_adapter_evidence.py",
  "scripts/framework_adapter_execution_evidence.py",
  "scripts/framework_adapter_release_gate.py",
  "scripts/hk_archive_gate.py",
  "scripts/install_pre_push_hooks.py",
  "scripts/namespace_contracts.py",
  "scripts/print_version_matrix.py",
  "scripts/run_pre_push_checks.py",
  "scripts/run_quality_checks.py",
  "scripts/run_submodule_checks.py",
  "scripts/scan_workspace_secrets.py",
  "scripts/maintainability_baseline.py",
  "scripts/strategy_evidence_gate.py",
  "scripts/research_spec_check.py",
  "scripts/benchmark_matrix_build.py",
  "scripts/workspace_doctor.py",
  "scripts/doctor_*.py",
  "scripts/workspace_architecture*.py",
  "scripts/workspace_governance.py",
  "scripts/workspace_governance_common.py",
  "scripts/workspace_governance_quality.py",
  "scripts/workspace_governance_submodules.py",
  "scripts/workspace_import_boundaries.py",
  "src/research_contracts/__init__.py",
  "src/research_contracts/artifact_envelope.py",
  "src/research_contracts/artifact_contracts.py",
  "src/research_contracts/research_capability_registry.py",
  "src/research_contracts/promotion_evidence.py",
  "src/research_contracts/promotion_evidence_checks.py",
  "src/research_contracts/promotion_evidence_common.py",
  "src/research_contracts/promotion_evidence_lineage.py",
]
exclude = [
  ".venv",
  "alpha-research",
  "artifacts",
  "build",
  "dist",
  "market-data-platform",
  "portfolio-backtester",
  "quant-execution-engine",
  "strategy-app",
  "strategy-pipeline",
]
