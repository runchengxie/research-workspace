schema_version: workspace_ownership_boundaries.v1
ownership_rules:
  - identifier: strategy-app:numeric-v2-adapter-only
    description: Numeric v2 app module may keep campaign-policy adaptation but not reusable ranking internals
    repo: strategy-app
    source: src/strategy_app/hotsector/hotsector_numeric_v2_ranking.py
    allowed_definitions:
      - _ranking_policy
      - score_numeric_v2_components
      - build_hotsector_numeric_v2_rankings
      - visible_field_control_ranking
      - bounded_visible_control_picks
      - risk_veto_visible_control_symbol
    max_unowned_definitions: 7
    target_max_unowned_definitions: 0
    target_pr: strategy-app#35

  - identifier: strategy-app:holdings-overlay-app-shell
    description: Holdings overlay app module may validate identity and rank candidates but must not own portfolio construction
    repo: strategy-app
    source: src/strategy_app/hotsector/hotsector_holdings_overlay_selection.py
    allowed_definitions:
      - HoldingsOverlaySelectionError
      - HoldingsOverlayTarget
      - _positive_int
      - _sha256
      - _canonical_sha256
      - _assert_owner_fields
      - _validate_candidate_identity
      - _validate_owner_summary
      - _rows_frame
      - _rank_eligible_union
      - build_holdings_overlay_target
    max_unowned_definitions: 1
    target_max_unowned_definitions: 0
    target_pr: strategy-app#36

  - identifier: strategy-app:deepseek-v4-app-shell
    description: DeepSeek V4 app module may own campaign and evidence composition but not reusable ranking-trial helpers
    repo: strategy-app
    source: src/strategy_app/hotsector/deepseek_v4.py
    allowed_definitions:
      - _load_spec
      - DeepSeekV4ReplayBundle
      - campaign_spec_record
      - _ranking_policy
      - analyze_deepseek_v4_phase1
      - build_intention_to_deploy_scores
      - _validated_execution_summaries
      - _paired_execution_daily
      - _paired_inference
      - _primary_blocks
      - _execution_gates
      - run_deepseek_v4_paired_replay
    max_unowned_definitions: 5
    target_max_unowned_definitions: 0
    target_pr: strategy-app#37

  - identifier: strategy-app:legacy-deepseek-stability-kernel
    description: Legacy DeepSeek stability analysis may retain report I/O while reusable diagnostics migrate to alpha-research
    repo: strategy-app
    source: src/strategy_app/hotsector/hotsector_deepseek_stability.py
    allowed_definitions:
      - write_deepseek_stability_report
      - load_deepseek_stability_report
    max_unowned_definitions: 1
    target_max_unowned_definitions: 0

  - identifier: strategy-app:legacy-deepseek-stability-metrics
    description: DeepSeek stability statistical diagnostics are migration debt owned by alpha-research; report header validation may remain in the app shell
    repo: strategy-app
    source: src/strategy_app/hotsector/_deepseek_stability_metrics.py
    allowed_definitions:
      - _validate_report_header
    max_unowned_definitions: 16
    target_max_unowned_definitions: 0

  - identifier: strategy-app:session-challenger-kernel
    description: Session challenger may retain frozen campaign control and reporting while reusable scoring/comparison kernels migrate to owner repositories
    repo: strategy-app
    source: src/strategy_app/hotsector/hotsector_session_challenger.py
    allowed_definitions:
      - SessionChallengerConfig
      - SessionChallengerResult
      - session_research_decision
      - _assert_runtime_inputs
      - _report_limitations
      - _report
      - _input_hashes
      - run_session_challenger
    max_unowned_definitions: 2
    target_max_unowned_definitions: 0

  - identifier: strategy-app:three-arm-contract-freeze
    description: Three-arm shadow remains strategy-contract coupled; freeze the current typed surface until the contract is split deliberately
    repo: strategy-app
    source: src/strategy_app/hotsector/_hotsector_three_arm_shadow_core.py
    allowed_definitions:
      - ThreeArmShadowError
      - _date
      - _sha256
      - _symbols
      - ThreeArmSelection
      - numeric_control_selection
      - _validated_repetitions
      - _validated_owner_metadata
      - owner_selection
      - validate_three_arm_day
    max_unowned_definitions: 0
    target_max_unowned_definitions: 0
