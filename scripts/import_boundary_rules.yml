schema_version: workspace_import_boundaries.v3
boundary_rules:
- identifier: research-workspace:contracts-no-direct-framework-imports
  description: cross-repository contracts must not directly import optional framework
    runtimes
  repo: .
  source: src/research_contracts
  forbidden:
  - qlib
  - vnpy
  - QuantConnect
  - AlgorithmImports
  - backtrader
  max_allowed: 0
- identifier: alpha-research:alpha-to-pipeline
  description: alpha-research should not grow runtime imports back into strategy pipeline
  repo: alpha-research
  source: src/alpha_research
  forbidden:
  - strategy_pipeline.pipeline
  max_allowed: 0
- identifier: alpha-research:alpha-to-backtesting
  description: alpha-research should not grow runtime imports into portfolio backtesting
  repo: alpha-research
  source: src/alpha_research
  forbidden:
  - portfolio_backtester
  max_allowed: 0
- identifier: alpha-research:alpha-to-execution
  description: alpha-research must stop at signal research and must not import execution runtime
  repo: alpha-research
  source: src/alpha_research
  forbidden:
  - quant_execution_engine
  max_allowed: 0
- identifier: alpha-research:alpha-to-strategy-core-metrics
  description: alpha-research should own research metrics
  repo: alpha-research
  source: src/alpha_research
  forbidden:
  - strategy_pipeline.metrics
  - strategy_pipeline.return_metrics
  max_allowed: 0
- identifier: alpha-research:alpha-to-strategy-compat
  description: alpha-research should own runtime compatibility shims
  repo: alpha-research
  source: src/alpha_research
  forbidden:
  - strategy_pipeline.compat
  max_allowed: 0
- identifier: alpha-research:alpha-to-strategy-rebalance
  description: alpha-research should own research rebalance sampling instead of importing
    strategy-pipeline contract implementation helpers
  repo: alpha-research
  source: src/alpha_research
  forbidden:
  - strategy_pipeline.contracts.rebalance
  max_allowed: 0
- identifier: alpha-research:alpha-to-strategy-signal-contract
  description: alpha-research should own canonical signal artifacts instead of importing
    strategy-pipeline contract modules
  repo: alpha-research
  source: src/alpha_research
  forbidden:
  - strategy_pipeline.contracts.signals
  max_allowed: 0
- identifier: portfolio-backtester:backtesting-to-pipeline
  description: portfolio-backtester should not import strategy pipeline runtime
  repo: portfolio-backtester
  source: src/portfolio_backtester
  forbidden:
  - strategy_pipeline.pipeline
  - strategy_pipeline.benchmarking
  max_allowed: 0
- identifier: portfolio-backtester:backtesting-to-alpha
  description: portfolio-backtester should not grow runtime imports into alpha implementation
  repo: portfolio-backtester
  source: src/portfolio_backtester
  forbidden:
  - alpha_research
  max_allowed: 0
- identifier: portfolio-backtester:backtesting-to-execution
  description: portfolio research simulation must remain broker-independent and must not import qexec runtime
  repo: portfolio-backtester
  source: src/portfolio_backtester
  forbidden:
  - quant_execution_engine
  max_allowed: 0
- identifier: portfolio-backtester:backtesting-to-strategy-core-metrics
  description: portfolio-backtester should own backtest metrics instead of importing
    strategy-pipeline top-level metric modules
  repo: portfolio-backtester
  source: src/portfolio_backtester
  forbidden:
  - strategy_pipeline.metrics
  - strategy_pipeline.return_metrics
  max_allowed: 0
- identifier: portfolio-backtester:backtesting-to-strategy-rebalance
  description: portfolio-backtester should own backtest rebalance sampling instead
    of importing strategy-pipeline contract implementation helpers
  repo: portfolio-backtester
  source: src/portfolio_backtester
  forbidden:
  - strategy_pipeline.contracts.rebalance
  max_allowed: 0
- identifier: portfolio-backtester:backtesting-to-strategy-liquidity-proxy
  description: portfolio-backtester should own capacity liquidity proxy derivation
    instead of importing strategy-pipeline top-level helpers
  repo: portfolio-backtester
  source: src/portfolio_backtester
  forbidden:
  - strategy_pipeline.liquidity_proxy
  max_allowed: 0
- identifier: portfolio-backtester:backtesting-to-strategy-contracts
  description: portfolio-backtester should own backtest pricing and strategy specs
    instead of importing strategy-pipeline contract modules
  repo: portfolio-backtester
  source: src/portfolio_backtester
  forbidden:
  - strategy_pipeline.contracts.backtest
  - strategy_pipeline.contracts.strategy
  max_allowed: 0
- identifier: market-data-platform:no-legacy-shared-namespace-imports
  description: market-data-platform must stay independent from legacy research internals
  repo: market-data-platform
  source: src
  forbidden:
  - cstree
  max_allowed: 0
- identifier: quant-execution-engine:no-legacy-shared-namespace-imports
  description: quant-execution-engine consumes targets.json, not research/backtest
    internals
  repo: quant-execution-engine
  source: src
  forbidden:
  - cstree
  max_allowed: 0
- identifier: quant-execution-engine:no-research-runtime-imports
  description: qexec starts from target artifacts and must not import alpha or portfolio research runtimes
  repo: quant-execution-engine
  source: src/quant_execution_engine
  forbidden:
  - alpha_research
  - portfolio_backtester
  max_allowed: 0
- identifier: strategy-app:no-control-plane-imports
  description: strategy-app may consume the public strategy-pipeline control plane but must not
    import private pipeline internals
  repo: strategy-app
  source: src/strategy_app
  forbidden:
  - strategy_pipeline_internal
  max_allowed: 0
- identifier: strategy-app:no-execution-runtime-imports
  description: strategy-app freezes strategy policy and must not import broker execution runtime
  repo: strategy-app
  source: src/strategy_app
  forbidden:
  - quant_execution_engine
  max_allowed: 0
- identifier: strategy-research:no-control-or-execution-runtime-imports
  description: strategy-research is a research evidence and presentation consumer and must
    not become an alternate orchestration or execution runtime
  repo: strategy-research
  source: src/style_factors
  forbidden:
  - strategy_pipeline
  - quant_execution_engine
  max_allowed: 0
- identifier: strategy-pipeline:no-execution-engine-imports
  description: strategy-pipeline exports execution targets without execution internals
  repo: strategy-pipeline
  source: src/strategy_pipeline
  forbidden:
  - quant_execution_engine
  max_allowed: 0
- identifier: strategy-pipeline:contracts-pure-handoff
  description: public strategy-pipeline contracts stay independent from CLI dispatch,
    owner implementations, execution internals, and optional runtimes
  repo: strategy-pipeline
  source: src/strategy_pipeline/control_plane/contracts.py
  forbidden:
  - alpha_research
  - portfolio_backtester
  - strategy_pipeline.cli
  - quant_execution_engine
  max_allowed: 0
- identifier: strategy-pipeline:liveops-no-cli-backedge
  description: public strategy-pipeline handoff and publication layers must not depend on CLI dispatch
  repo: strategy-pipeline
  source: src/strategy_pipeline/control_plane
  forbidden:
  - strategy_pipeline.cli
  max_allowed: 0
- identifier: strategy-pipeline:pipeline-no-cli-backedge
  description: public strategy-pipeline runner must not depend on CLI dispatch
  repo: strategy-pipeline
  source: src/strategy_pipeline/control_plane/runner.py
  forbidden:
  - strategy_pipeline.cli
  max_allowed: 0
- identifier: strategy-pipeline:target-contract-no-direct-framework-imports
  description: public handoff contracts must not directly import optional framework runtimes
  repo: strategy-pipeline
  source: src/strategy_pipeline/control_plane/contracts.py
  forbidden:
  - qlib
  - vnpy
  - QuantConnect
  - AlgorithmImports
  - backtrader
  max_allowed: 0
- identifier: market-data-platform:published-contract-no-direct-qlib-imports
  description: published data contracts must not import Qlib; Qlib belongs in adapters
  repo: market-data-platform
  source: src/market_data_platform/contract.py
  forbidden:
  - qlib
  max_allowed: 0
- identifier: alpha-research:signal-contract-no-direct-qlib-imports
  description: canonical signal contracts must not import Qlib
  repo: alpha-research
  source: src/alpha_research/signal_artifact.py
  forbidden:
  - qlib
  max_allowed: 0
- identifier: portfolio-backtester:contracts-no-direct-framework-imports
  description: backtest exchange contracts must not import framework runtimes
  repo: portfolio-backtester
  source: src/portfolio_backtester/contracts.py
  forbidden:
  - qlib
  - QuantConnect
  - AlgorithmImports
  - backtrader
  max_allowed: 0
- identifier: quant-execution-engine:domain-no-direct-vnpy-imports
  description: qexec domain contracts must not directly import vn.py DTOs
  repo: quant-execution-engine
  source: src/quant_execution_engine/domain.py
  forbidden:
  - vnpy
  max_allowed: 0
  required: false
- identifier: quant-execution-engine:legacy-domain-no-direct-vnpy-imports
  description: legacy domain compatibility models must not directly import vn.py DTOs
  repo: quant-execution-engine
  source: src/quant_execution_engine/models.py
  forbidden:
  - vnpy
  max_allowed: 0
- identifier: quant-execution-engine:targets-no-direct-vnpy-imports
  description: research target contracts must not directly import a transport runtime
  repo: quant-execution-engine
  source: src/quant_execution_engine/targets.py
  forbidden:
  - vnpy
  max_allowed: 0
- identifier: research-workspace:legacy-hotsector-internal-imports
  description: top-level research-workspace scripts should consume hotsector artifacts
    instead of importing market-intel hot_sector_screener internals; existing dev
    scripts are legacy budget only
  repo: .
  source: scripts
  forbidden:
  - hot_sector_screener
  max_allowed: 10
source_layout_rules:
- identifier: strategy-pipeline:no-local-alpha-backtesting-source
  description: strategy-pipeline should orchestrate alpha research and portfolio backtesting
    instead of carrying local alpha/backtesting implementation modules
  repo: strategy-pipeline
  forbidden_sources:
  - src/alpha_research
  - src/portfolio_backtester
  max_allowed: 0
- identifier: strategy-pipeline:no-local-strategy-app-source
  description: strategy-pipeline must not embed either the current or legacy strategy application
    source package
  repo: strategy-pipeline
  forbidden_sources:
  - src/strategy_app
  - src/research_apps
  max_allowed: 0
private_import_rules:
- identifier: strategy-app:no-cross-repo-private-imports
  description: strategy-app must consume owner repositories through public APIs only
  repo: strategy-app
  source: src/strategy_app
  external_roots:
  - alpha_research
  - market_data_platform
  - portfolio_backtester
  - research_contracts
  - strategy_pipeline
  - quant_execution_engine
  max_allowed: 0
- identifier: strategy-pipeline:no-cross-repo-private-imports
  description: strategy-pipeline orchestration must consume owner repositories through public APIs only
  repo: strategy-pipeline
  source: src/strategy_pipeline
  external_roots:
  - alpha_research
  - market_data_platform
  - portfolio_backtester
  - research_contracts
  - strategy_app
  - quant_execution_engine
  max_allowed: 0
- identifier: strategy-research:no-owner-private-test-imports
  description: strategy-research integration tests must exercise owner repositories through public APIs
  repo: strategy-research
  source: tests
  external_roots:
  - alpha_research
  - portfolio_backtester
  - market_data_platform
  - research_contracts
  - strategy_app
  - strategy_pipeline
  max_allowed: 0
