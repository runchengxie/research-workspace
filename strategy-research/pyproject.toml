[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strategy-research-style-factors"
version = "0.1.0"
description = "Strategy-research style-factor presentation layer (charts, reports, attribution, robustness)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alpha-research>=0.4.0",
  "portfolio-backtester",
  "research-contracts",
  "numpy>=1.23",
  "pandas>=2.0",
  "pyarrow>=23.0.1",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pytest-cov>=5",
  "ruff>=0.8",
  "ty>=0.0.55",
]

[tool.setuptools]
package-dir = {"style_factors" = "style_factors"}

[tool.setuptools.packages.find]
where = ["."]
include = ["style_factors", "style_factors.*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".venv",
  "artifacts",
  "build",
  "dist",
  "outputs",
  "archive",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RET", "SIM", "RUF", "C90"]
ignore = [
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.ruff.lint.isort]
known-first-party = ["style_factors", "alpha_research", "portfolio_backtester"]

[tool.ty.src]
include = ["style_factors", "tests"]
exclude = [
  ".venv",
  "archive",
  "artifacts",
  "build",
  "dist",
  "experiments",
  "outputs",
]

[tool.coverage.run]
source = ["style_factors"]

[tool.uv.sources]
alpha-research = { path = "../alpha-research" }
portfolio-backtester = { path = "../portfolio-backtester" }
research-contracts = { git = "https://github.com/runchengxie/research-workspace.git", subdirectory = "src/research_contracts", rev = "f28e97008b7c540730720aac82e63a2944a89b58" }
