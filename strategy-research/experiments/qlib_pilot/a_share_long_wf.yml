# A-share with longer walk-forward validation window.
# Extends a_share preset but uses a larger validation window so OOS IC
# reflects a stable signal instead of a short (5-rebalance) artifact.
# Valid-window experiment showed 12-month validation OOS IC 0.10 vs
# 3-month 0.06.
extends: "strategy-pipeline/configs/presets/a_share.yml"

eval:
  walk_forward:
    enabled: true
    n_windows: 3
    test_size: 0.4
    step_size: null
    anchor_end: true
    backtest_enabled: true
