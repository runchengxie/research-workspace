# top800 stability check - start 20221101
# Same strict evaluation as a_share_top800_verify.yml but a different data
# start point, to test whether the Sharpe +1.41 (2022-01 start) is robust
# across market regimes rather than a single-window artifact.
extends: "strategy-pipeline/configs/presets/a_share.yml"

data:
  start_date: "20221101"
  asset_coverage_start_date: "20221101"

research_universe:
  symbols_file: null
  by_date_file: "artifacts/assets/universe/top800_by_date.csv"

eval:
  top_k: 30
  walk_forward:
    enabled: true
    n_windows: 3
    test_size: 0.4
    step_size: null
    anchor_end: true
    backtest_enabled: true

backtest:
  top_k: 30
  execution_sim:
    enabled: true
    participation_rate: 0.10
    liquidity_cols:
      - medadv20_amount
      - amount
    buy_max_days: 10
    sell_max_days: "until_next_rebalance"
    zero_fill_abort_days_buy: 3
