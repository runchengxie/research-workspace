# Promotion baseline v2: full market (2019 start), strict evaluation.
# Matches candidate v2 window so comparability holds.
extends: "strategy-pipeline/configs/presets/a_share.yml"

data:
  start_date: "20190101"
  asset_coverage_start_date: "20190101"

backtest:
  benchmark_symbol: null
  benchmark_returns_file: "artifacts/assets/benchmark/csi300_daily_return.parquet"

eval:
  top_k: 30
  walk_forward:
    enabled: true
    n_windows: 5
    test_size: 0.3
    step_size: null
    anchor_end: true
    backtest_enabled: true
