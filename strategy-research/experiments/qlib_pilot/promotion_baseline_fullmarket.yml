# Promotion baseline: full market, strict evaluation with benchmark.
# Same engine config as candidate but full-market universe (preset default).
extends: "strategy-pipeline/configs/presets/a_share.yml"

data:
  start_date: "20220101"
  asset_coverage_start_date: "20220101"

backtest:
  benchmark_symbol: null
  benchmark_returns_file: "artifacts/assets/benchmark/csi300_daily_return.parquet"

eval:
  top_k: 30
  walk_forward:
    enabled: true
    n_windows: 3
    test_size: 0.4
    step_size: null
    anchor_end: true
    backtest_enabled: true
