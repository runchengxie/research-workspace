# A-share combo verification: top_k=30 + extended window + long validation.
# Combines the three confirmed configuration points from the exploration arc:
# - top_k=30 (diversified; top_k=5 concentrated is Sharpe -1.41 over long window)
# - extended data window (2022-01, walk-forward has room for longer validation)
# - walk_forward test_size 0.4 (~12-month validation; short validation was an artifact)
# Execution: VWAP-style 10%x10day splitting (proven to raise fill rate to 88%).
# This is the definitive test of whether the full-market signal makes money
# under a stable evaluation design.
extends: "strategy-pipeline/configs/presets/a_share.yml"

data:
  start_date: "20220101"
  asset_coverage_start_date: "20220101"

eval:
  top_k: 30
  walk_forward:
    enabled: true
    n_windows: 3
    test_size: 0.4
    step_size: null
    anchor_end: true
    backtest_enabled: true

backtest:
  top_k: 30
  execution_sim:
    enabled: true
    participation_rate: 0.10
    liquidity_cols:
      - medadv20_amount
      - amount
    buy_max_days: 10
    sell_max_days: "until_next_rebalance"
    zero_fill_abort_days_buy: 3
