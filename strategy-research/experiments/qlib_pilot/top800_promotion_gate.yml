metadata:
  status: active
  owner: research
  last_verified: 2026-08-10
  expected_artifacts:
    - ../artifacts/reports/top800_promotion_gate.json
    - ../artifacts/reports/top800_promotion_gate.csv

promotion_gate:
  baseline_run: artifacts/runs/promotion_baseline_fullmarket_20260810_084349_17e33b7c
  candidate_run: artifacts/runs/promotion_candidate_top800_20260810_090559_75928998
  candidate_exposure_screen_report: ../artifacts/reports/candidate_top800/exposure_screen.json
  comparability_keys:
    - market
    - data.provider
    - data.source_mode
    - data.start_date
    - data.end_date
    - label.target_col
    - label.horizon_mode
    - label.shift_days
    - features.list
    - eval.rebalance_frequency
    - backtest.rebalance_frequency
    - backtest.transaction_cost_bps
  required_evidence:
    - main_eval
    - backtest
    - walk_forward
    - cost_turnover
    - feature_stability
    - benchmark
    - cpcv
    - dsr
    - exposure_screen
  cpcv:
    baseline_report: ../artifacts/reports/cpcv_baseline_fullmarket/cpcv_summary.json
    candidate_report: ../artifacts/reports/cpcv_candidate_top800/cpcv_summary.json
  dsr:
    baseline_report: ../artifacts/reports/pbo_top800/pbo_summary.json
    candidate_report: ../artifacts/reports/pbo_top800/pbo_summary.json
  hard_rejections:
    constant_prediction: true
    zero_feature_importance: true
    require_final_oos: false
    min_cv_ic_valid_folds: 2
    min_cpcv_path_count: 5
    min_dsr_n_trials: 10
  soft_thresholds:
    min_eval_ic_ir: 0.0
    min_eval_long_short: 0.0
    min_walk_forward_test_ic_mean: 0.0
    min_final_oos_ic_mean: null
    min_final_oos_long_short: null
    min_backtest_sharpe_delta: 0.0
    max_backtest_drawdown: 0.3
    max_backtest_avg_turnover: 0.9
    max_backtest_avg_cost_drag: 0.02
    min_cpcv_sharpe_median: 0.0
    min_cpcv_sharpe_p25: 0.0
    min_cpcv_positive_sharpe_ratio: 0.6
    min_cpcv_ic_median: 0.0
    min_cpcv_long_short_median: 0.0
    max_cpcv_drawdown_p10: 0.35
    min_dsr: 0.8
    max_exposure_screen_breach_count: 0
  output_json: ../artifacts/reports/top800_promotion_gate.json
  output_csv: ../artifacts/reports/top800_promotion_gate.csv
